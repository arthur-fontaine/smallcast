name: Smallcast
options:
  bundleIdPrefix: com.smallcast
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Stable self-signed identity so macOS keeps the Accessibility grant across rebuilds.
    # Create it once — see docs/signing.md.
    CODE_SIGN_IDENTITY: "Smallcast Self-Signed"
    SWIFT_STRICT_CONCURRENCY: complete
    SMALLCAST_BUNDLE_IDENTIFIER: com.smallcast.app
  configs:
    Debug:
      SMALLCAST_BUNDLE_IDENTIFIER: com.smallcast.app.dev
      DICTATION_EXECUTABLE_NAME: Smallcast Dev Dictation
    Release:
      DICTATION_EXECUTABLE_NAME: Smallcast Dictation
      # Release-only: library validation refuses Debug's `.debug.dylib`, whose team never matches.
      ENABLE_HARDENED_RUNTIME: YES
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Smallcast:
    type: application
    platform: macOS
    sources:
      - path: Smallcast
        # The helper's own sources: compiling them in would link Vision and PDFKit into the app,
        # which is the whole thing running recognition out of process avoids.
        excludes:
          - Features/Clipboard/Service/ClipboardTextExtractor.swift
          - Features/Clipboard/Service/ClipboardTextHelper.swift
          - Features/Dictation/Helper
          - Resources/EmojiKeywords
      # A folder reference keeps the packs in their own directory, which `EmojiIndex` lists.
      - path: Smallcast/Resources/EmojiKeywords
        type: folder
      # The MIT mark's licence asks the notice to travel with the binary, not just the repo.
      - path: NOTICE.md
        buildPhase: resources
    dependencies:
      - target: DictationHelper
        link: false
        embed: false
      # Resolve the embedded helper against the active channel, not Xcode's default configuration.
      - framework: "$(BUILT_PRODUCTS_DIR)/$(DICTATION_EXECUTABLE_NAME).app"
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: ClipboardTextHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(SMALLCAST_BUNDLE_IDENTIFIER)"
        INFOPLIST_FILE: Smallcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Smallcast/Smallcast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: smallcast
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Debug is its own channel, like beta/stable in release.yml: a distinct bundle id means a
        # locally-run build gets its own prefs, caches, TCC grants and login item instead of
        # inheriting — and corrupting — the installed app's state.
        Debug:
          PRODUCT_NAME: Smallcast Dev

  ClipboardTextHelper:
    type: tool
    platform: macOS
    sources:
      - Smallcast/Features/Clipboard/Service/ClipboardTextExtractor.swift
      - Smallcast/Features/Clipboard/Service/ClipboardTextHelper.swift
    settings:
      base:
        # release.yml passes PRODUCT_NAME on the xcodebuild line, which hits every target: without
        # these two pinned, a channel build renames the executable `ClipboardTextWorker` looks for
        # and gives the module a name with a space in it.
        EXECUTABLE_NAME: ClipboardTextHelper
        PRODUCT_MODULE_NAME: ClipboardTextHelper
        SKIP_INSTALL: YES

  DictationHelper:
    type: application
    platform: macOS
    info:
      path: Smallcast/Features/Dictation/Helper/Info.plist
      properties:
        CFBundleName: "$(DICTATION_EXECUTABLE_NAME)"
        CFBundleDisplayName: "$(DICTATION_EXECUTABLE_NAME)"
        LSUIElement: true
    sources:
      - Smallcast/Features/Dictation/Helper
      - Smallcast/Features/Dictation/Model/DictationModel.swift
      - Smallcast/Features/Dictation/Model/DictationAudioChunks.swift
      - Smallcast/Features/Dictation/Model/DictationLanguage.swift
      - Smallcast/Features/Dictation/Service/DictationWire.swift
    settings:
      base:
        EXECUTABLE_NAME: "$(DICTATION_EXECUTABLE_NAME)"
        PRODUCT_NAME: "$(DICTATION_EXECUTABLE_NAME)"
        WRAPPER_NAME: "$(DICTATION_EXECUTABLE_NAME).app"
        PRODUCT_MODULE_NAME: DictationHelper
        PRODUCT_BUNDLE_IDENTIFIER: "$(SMALLCAST_BUNDLE_IDENTIFIER).dictation"
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O
